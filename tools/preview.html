<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1c1f2a;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1600, H = +params.get('h') || 900;
const model = await (await fetch('model.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: params.get('alpha') === '1' });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (params.get('alpha') !== '1') scene.background = new THREE.Color(0x1c1f2a);

// Minecraft box-UV mapping, exactly as net.minecraft.client.model.geom.ModelPart.Cube
function cubeGeometry(from, size, uv, mirror) {
  const [x0, y0, z0] = from, [w, h, d] = size, [u, v] = uv;
  const x1 = x0 + w, y1 = y0 + h, z1 = z0 + d;
  const V = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  const faces = [
    { v:[5,1,2,6], r:[u+d+w, v+d, u+d+w+d, v+d+h], n:[1,0,0] },   // EAST
    { v:[0,4,7,3], r:[u, v+d, u+d, v+d+h], n:[-1,0,0] },          // WEST
    { v:[5,4,0,1], r:[u+d, v, u+d+w, v+d], n:[0,-1,0] },          // DOWN (visual top)
    { v:[2,3,7,6], r:[u+d+w, v+d, u+d+w+w, v], n:[0,1,0] },        // UP (visual bottom)
    { v:[1,0,3,2], r:[u+d, v+d, u+d+w, v+d+h], n:[0,0,-1] },       // NORTH (front)
    { v:[4,5,6,7], r:[u+d+w+d, v+d, u+d+w+d+w, v+d+h], n:[0,0,1] } // SOUTH
  ];
  const pos = [], uvs = [], nor = [], idx = [];
  const TW = model.tw, TH = model.th;
  for (const f of faces) {
    let [u1, v1, u2, v2] = f.r;
    if (mirror) [u1, u2] = [u2, u1];
    const fuv = [[u2, v1], [u1, v1], [u1, v2], [u2, v2]];
    const base = pos.length / 3;
    f.v.forEach((vi, k) => {
      let p = V[vi]; pos.push(p[0], p[1], p[2]);
      uvs.push(fuv[k][0] / TW, 1 - fuv[k][1] / TH);
      nor.push(...f.n);
    });
    // MC vertices are counter-clockwise when viewed with Y down; flip winding later via scale
    idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

function buildMinion(texUrl, pose) {
  const tex = new THREE.TextureLoader().load(texUrl);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: .65, metalness: .15, alphaTest: .5 });
  const root = new THREE.Group();          // world space
  const flip = new THREE.Group();          // MC: scale(-1,-1,1) translate(0,-24,0)
  flip.scale.set(-1, -1, 1); flip.position.y = 24;
  root.add(flip);
  const nodes = {};
  for (const [name, parent, pivot] of model.parts) {
    const n = new THREE.Group(); n.name = name;
    n.userData.pivot = pivot; nodes[name] = n;
  }
  for (const [name, parent, pivot] of model.parts) {
    const n = nodes[name];
    const pp = parent ? model.parts.find(p => p[0] === parent)[2] : [0, 0, 0];
    n.position.set(pivot[0] - pp[0], pivot[1] - pp[1], pivot[2] - pp[2]);
    (parent ? nodes[parent] : flip).add(n);
  }
  for (const [part, cname, from, size, uv, mirror] of model.cubes) {
    const pv = nodes[part].userData.pivot;
    const g = cubeGeometry([from[0] - pv[0], from[1] - pv[1], from[2] - pv[2]], size, uv, mirror);
    const m = new THREE.Mesh(g, mat); m.name = part + '_' + cname; m.castShadow = true;
    nodes[part].add(m);
  }
  const P = pose || {};
  for (const k in P) nodes[k].rotation.set(...P[k]);
  root.userData.nodes = nodes;
  return root;
}

const tiers = ['copper', 'gold', 'diamond'];
const mode = params.get('mode') || 'hero';
const poses = {
  copper:  { right_arm: [-1.6, 0, 0.1], head: [0.1, 0.25, 0], left_arm: [0.2, 0, -0.1], antenna: [0, 0, 0.2] },
  gold:    { right_arm: [-0.6, 0, 0], head: [-0.05, 0, 0], right_leg: [0.35, 0, 0], left_leg: [-0.35, 0, 0], left_arm: [0.4, 0, 0] },
  diamond: { right_arm: [-2.4, 0.2, 0], head: [0.15, -0.3, 0], left_arm: [-0.3, 0, -0.25] },
  tpose: {}
};
const group = new THREE.Group(); scene.add(group);
const minions = [];
if (mode === 'single') {
  const t = params.get('tier');
  const m = buildMinion('tex/minion_' + t + '.png', params.get('pose') === 't' ? {} : poses[t]);
  m.rotation.y = (+params.get('ry') || 0);
  group.add(m); minions.push(m);
} else {
  tiers.forEach((t, i) => {
    const m = buildMinion('tex/minion_' + t + '.png', poses[t]);
    m.position.x = (i - 1) * 24; m.rotation.y = (i - 1) * 0.35;
    group.add(m); minions.push(m);
  });
}
// ground: blueprint plate
const groundTex = new THREE.TextureLoader().load('ground.png');
groundTex.magFilter = THREE.NearestFilter; groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(16, 16);
groundTex.colorSpace = THREE.SRGBColorSpace;
if (params.get('alpha') !== '1') {
  const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ map: groundTex, roughness: .9 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
}
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x302020, 1.4));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(-30, 60, -40); sun.castShadow = true;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60; sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const rim = new THREE.DirectionalLight(0x88bbff, 1.2); rim.position.set(40, 30, 50); scene.add(rim);

const cam = new THREE.PerspectiveCamera(mode === 'single' ? 30 : 32, W / H, 1, 1000);
if (mode === 'single') { cam.position.set(0, 22, -78); cam.lookAt(0, 13, 0); }
else { cam.position.set(0, 30, -98); cam.lookAt(0, 13, 0); }

window.renderOnce = () => { renderer.render(scene, cam); return true; };
window.exportGLB = async (tier) => {
  const m = buildMinion('tex/minion_' + tier + '.png', {});
  await new Promise(r => setTimeout(r, 300));
  m.scale.setScalar(1 / 16); // 1 unit = 1 block
  const s = new THREE.Scene(); s.add(m);
  const res = await new GLTFExporter().parseAsync(s, { binary: true });
  const bytes = new Uint8Array(res); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
};
setTimeout(() => { renderer.render(scene, cam); window.READY = true; }, 600);
</script></body></html>
