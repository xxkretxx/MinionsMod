plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+${minecraft_version}-fabric"
group = mod_group_id
base { archivesName = mod_id }

// Shared code + assets live in ../common and are compiled into every loader jar.
sourceSets.main {
    java.srcDir('../common/src/main/java')
    resources.srcDir('../common/src/main/resources')
}

loom {
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def props = [version: mod_version, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
    exclude '**/*.bbmodel'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
