name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: chmod +x gradlew && ./gradlew build --continue 2>&1 | tee build.log; grep -q "BUILD SUCCESSFUL" build.log
      - name: compile errors
        if: failure()
        run: grep -A3 "error:" build.log | head -300
      - name: server test (fabric)
        run: bash .ci/server_test.sh fabric fabric/runs/server
      - name: server test (forge)
        run: bash .ci/server_test.sh forge forge/runs/server
      - name: server test (neoforge)
        run: bash .ci/server_test.sh neoforge neoforge/run
      - uses: actions/upload-artifact@v4
        with:
          name: build-minions-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && (./gradlew :forge:compileJava > /dev/null 2>&1 || true)
      - name: javap
        run: |
          JARS=$(find /home/runner/work ~/.gradle -name '*.jar' 2>/dev/null | grep -v sources | grep -vF 26.3)
          findjar(){ for j in $JARS; do unzip -l "$j" 2>/dev/null | grep -q " $1$" && { echo "$j"; return; }; done; }
          CP="$(findjar net/minecraftforge/network/ChannelBuilder.class):$(findjar net/minecraftforge/eventbus/api/bus/EventBus.class):$(findjar net/minecraft/client/gui/screens/Screen.class)"
          for c in 'net.minecraftforge.client.event.RenderHighlightEvent$Block' net.minecraftforge.client.event.RenderHighlightEvent 'net.minecraftforge.client.event.AddFramePassEvent' net.minecraftforge.eventbus.api.bus.CancellableEventBus; do echo "===== $c"; javap -public -cp "$CP" "$c" 2>&1 | grep -v "^Compiled" | head -30; done

