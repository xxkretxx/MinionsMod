name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: chmod +x gradlew && ./gradlew build --continue 2>&1 | tee build.log; grep -q "BUILD SUCCESSFUL" build.log
      - name: compile errors
        if: failure()
        run: grep -A3 "error:" build.log | head -300
      - name: server test (fabric)
        run: |
          mkdir -p fabric/runs/server && echo "eula=true" > fabric/runs/server/eula.txt
          (timeout 300 ./gradlew :fabric:runServer --args="nogui" > server.log 2>&1 || true)
          grep -E "Done \(|buildminions|ERROR|Exception" server.log | head -40
          grep -q "Done (" server.log
      - uses: actions/upload-artifact@v4
        with:
          name: build-minions-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && (./gradlew :common:compileJava :fabric:compileJava --continue > /dev/null 2>&1 || true)
      - name: javap
        run: |
          MC=""
          for j in $(find /home/runner/work ~/.gradle -name '*.jar' 2>/dev/null | grep -F "1.21.11" | grep -iE 'minecraft|neoform|vanilla|merged' | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/screens/Screen.class"; then MC="$j"; break; fi; done
          FAPI=$( (find /home/runner/work -path '*remapped*' -name '*fabric-rendering-v1*.jar'; find ~/.gradle -name 'fabric-rendering-v1*.jar') 2>/dev/null | grep -v sources | head -1)
          echo "MC=$MC FAPI=$FAPI"
          for c in net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.screens.Screen net.minecraft.client.Minecraft net.minecraft.world.entity.Entity net.minecraft.server.level.ServerPlayer net.minecraft.world.level.block.Blocks com.mojang.blaze3d.platform.InputConstants net.minecraft.client.input.MouseButtonEvent net.minecraft.client.renderer.LightTexture net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.RenderType net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.KeyMapping net.minecraft.world.level.storage.ValueInput net.minecraft.nbt.CompoundTag net.minecraft.SharedConstants net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.gui.Font net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement net.fabricmc.fabric.api.client.rendering.v1.ModelLayerRegistry net.fabricmc.fabric.api.client.rendering.v1.EntityModelLayerRegistry net.minecraft.resources.Identifier net.minecraft.resources.ResourceLocation net.minecraft.client.renderer.state.CameraRenderState net.minecraft.client.renderer.state.LevelRenderState; do echo "===== $c"; javap -public -cp "$MC:$FAPI" "$c" 2>&1 | grep -v "^Compiled"; done
