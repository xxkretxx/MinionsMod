name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: chmod +x gradlew && ./gradlew build --continue 2>&1 | tee build.log; grep -q "BUILD SUCCESSFUL" build.log
      - name: compile errors
        if: failure()
        run: grep -A3 "error:" build.log | head -400
      - name: server test (fabric)
        run: bash .ci/server_test.sh fabric fabric/runs/server
      - name: server test (forge)
        run: bash .ci/server_test.sh forge forge/runs/server Server
      - name: server test (neoforge)
        run: bash .ci/server_test.sh neoforge neoforge/run
      - uses: actions/upload-artifact@v4
        with:
          name: build-minions-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && (./gradlew compileJava --continue > /dev/null 2>&1 || true)
      - name: javap
        run: |
          JARS=$(find /home/runner/work ~/.gradle -name '*.jar' 2>/dev/null | grep -v sources | grep -vF 26.3 | grep -vF 1.21.11)
          findjar(){ for j in $JARS; do unzip -l "$j" 2>/dev/null | grep -q " $1$" && { echo "$j"; return; }; done; }
          MC=$(for j in $JARS; do case "$j" in *1.21.1*) unzip -l "$j" 2>/dev/null | grep -q " net/minecraft/client/gui/screens/Screen.class$" && { echo "$j"; break; };; esac; done)
          FAPI=$(find /home/runner/work -path '*remapped*' -name '*fabric-rendering-v1*.jar' | head -1):$(find /home/runner/work -path '*remapped*' -name '*fabric-networking-api-v1*.jar' | head -1):$(find /home/runner/work -path '*remapped*' -name '*fabric-item-group*.jar' | head -1)
          NEO=$(findjar net/neoforged/neoforge/client/event/RenderLevelStageEvent.class)
          FORGE=$(findjar net/minecraftforge/network/ChannelBuilder.class); EB=$(findjar net/minecraftforge/eventbus/api/IEventBus.class); FML=$(findjar net/minecraftforge/fml/javafmlmod/FMLJavaModLoadingContext.class)
          echo "MC=$MC"; echo "NEO=$NEO FORGE=$FORGE"
          CP="$MC:$FAPI:$NEO:$FORGE:$EB:$FML"
          for c in net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.screens.Screen net.minecraft.client.model.EntityModel net.minecraft.client.renderer.entity.MobRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.RenderType net.minecraft.client.renderer.MultiBufferSource com.mojang.blaze3d.vertex.VertexConsumer net.minecraft.client.KeyMapping net.minecraft.nbt.CompoundTag net.minecraft.nbt.ListTag net.minecraft.nbt.NbtUtils net.minecraft.world.entity.Entity net.minecraft.world.entity.Mob net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.EntityType$Builder net.minecraft.world.item.Item$Properties net.minecraft.world.item.ItemStack net.minecraft.world.item.crafting.ShapedRecipe net.minecraft.world.item.crafting.ShapelessRecipe net.minecraft.world.item.crafting.SingleItemRecipe net.minecraft.world.item.crafting.Ingredient net.minecraft.world.item.crafting.RecipeManager net.minecraft.world.item.crafting.RecipeHolder net.minecraft.world.level.block.state.BlockBehaviour$Properties net.minecraft.server.level.ServerPlayer net.minecraft.world.entity.player.Player net.minecraft.world.entity.EntityType net.minecraft.client.Minecraft net.minecraft.client.player.LocalPlayer net.minecraft.world.InteractionResult net.minecraft.sounds.SoundEvents net.minecraft.core.particles.DustParticleOptions net.minecraft.world.item.CreativeModeTab$Builder net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback net.neoforged.neoforge.client.event.RenderLevelStageEvent net.neoforged.neoforge.client.event.RegisterGuiLayersEvent net.neoforged.neoforge.network.PacketDistributor net.minecraftforge.network.ChannelBuilder net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext net.minecraftforge.client.event.RenderLevelStageEvent net.minecraftforge.client.event.RegisterGuiOverlaysEvent net.minecraftforge.client.event.AddGuiOverlayLayersEvent net.minecraftforge.event.TickEvent$ClientTickEvent; do echo "===== $c"; javap -public -cp "$CP" "$c" 2>&1 | grep -v "^Compiled"; done
