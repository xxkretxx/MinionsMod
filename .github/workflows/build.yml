name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: server test (loads the mod + data packs on a real dedicated server)
        run: |
          mkdir -p fabric/run && echo "eula=true" > fabric/run/eula.txt
          (timeout 300 ./gradlew :fabric:runServer --args="nogui" > server.log 2>&1 || true)
          grep -E "Done \(|ERROR|Exception" server.log | grep -v "server.properties" | head -30
          grep -q "Done (" server.log
      - uses: actions/upload-artifact@v4
        with:
          name: build-minions-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
