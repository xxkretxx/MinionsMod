name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: run server and check data loading
        run: |
          chmod +x gradlew
          mkdir -p fabric/run && echo "eula=true" > fabric/run/eula.txt
          (timeout 240 ./gradlew :fabric:runServer --args="nogui" > server.log 2>&1 || true)
          grep -E "PROBE|Done \(|^\s+at dev|Exception" server.log | grep -v "^\s*at " | head -80
      - name: javap
        run: |
          MC=$(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | grep -iE 'minecraft.*(merged|client)' | grep -v sources | head -1)
          for c in net.minecraft.util.datafix.DataFixers net.minecraft.util.datafix.fixes.References net.minecraft.util.datafix.DataFixTypes net.minecraft.SharedConstants net.minecraft.WorldVersion net.minecraft.world.level.storage.DataVersion net.minecraft.nbt.NbtOps net.minecraft.nbt.NbtUtils; do
            echo "===== $c"; javap -public -cp "$MC" "$c" 2>&1 | grep -vE "^\s+public static final net.minecraft.util.datafix.fixes.References|^Compiled" | head -60; done
