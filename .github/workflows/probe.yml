name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: chmod +x gradlew && ./gradlew build --continue > build.log 2>&1; grep -E "BUILD|error:" -A3 build.log | head -80
      - name: run server
        run: |
          mkdir -p fabric/run && echo "eula=true" > fabric/run/eula.txt
          (timeout 300 ./gradlew :fabric:runServer --args="nogui" > server.log 2>&1 || true)
          grep -E "PROBE|Done \(|Exception|ERROR" server.log | head -80; grep -A4 "error:" server.log | head -40
